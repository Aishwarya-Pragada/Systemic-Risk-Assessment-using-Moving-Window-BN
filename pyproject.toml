[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bnsr"
version = "0.1.0"
description = "Moving-window Bayesian network model for systemic risk (Chan, Chu & So, 2023) - reimplementation"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
